version: '3.9'
services:
  app:
    build: .
    container_name: klassencoach-app
    ports:
      - "4001:4001"
    env_file: .env
    depends_on:
      - db
    working_dir: /usr/src/app
  db:
    image: mariadb:10.11
    container_name: klassencoach-db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: klassencoach
      MARIADB_USER: klassencoach
      MARIADB_PASSWORD: klassencoachpass
    ports:
      - "4307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
volumes:
  db_data:
